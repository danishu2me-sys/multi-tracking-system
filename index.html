<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MULTI TRACKING SYSTEM - POWERED BY DANISH RAIS (CLOUD SYNC ACTIVE)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-main: #050b14;
      --bg-panel: #0b1526;
      --bg-card: #0f1c33;
      --bg-row-alt: #091222;
      --bg-row-hover: #142442;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --border-color: #1e2e4a;
      --table-header-bg: #132b4f;
      --table-header-text: #ffffff;
      --total-row-bg: #1e3a5f;
      --total-row-text: #ffffff;
      --input-bg: #070e1c;
      --input-border: #0284c7;

      --metric-prod: #10b981;
      --metric-pct: #38bdf8;
      --metric-lpc: #f472b6;
      --metric-drop: #f59e0b;
    }

    body.light-theme {
      --bg-main: #f1f5f9;
      --bg-panel: #ffffff;
      --bg-card: #ffffff;
      --bg-row-alt: #f8fafc;
      --bg-row-hover: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-subtle: #64748b;
      --border-color: #cbd5e1;
      --table-header-bg: #1e3a5f;
      --table-header-text: #ffffff;
      --total-row-bg: #1e3a5f;
      --total-row-text: #ffffff;
      --input-bg: #ffffff;
      --input-border: #0284c7;

      --metric-prod: #059669;
      --metric-pct: #0284c7;
      --metric-lpc: #db2777;
      --metric-drop: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Calibri', 'Segoe UI', sans-serif; transition: background 0.15s ease, color 0.15s ease; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-size: 12px; }

    /* Top Navigation Bar */
    .top-header {
      background: var(--bg-panel); color: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center; padding: 0 12px;
      height: 38px; flex-shrink: 0; position: relative;
      z-index: 999999 !important; white-space: nowrap;
    }

    .top-nav-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .nav-tab-btn, .dropdown-btn {
      padding: 4px 10px; font-size: 11px; font-weight: 800; border-radius: 4px;
      border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s;
      color: var(--text-main); background: var(--bg-card); display: inline-flex; align-items: center; gap: 5px;
      height: 28px;
    }
    .nav-tab-btn:hover, .dropdown-btn:hover { background: rgba(2, 132, 199, 0.2); border-color: #0284c7; }
    .nav-tab-btn.active, .dropdown-btn.active {
      background: #0284c7; color: #ffffff; border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(2, 132, 199, 0.4);
    }

    .dropdown { position: relative; display: inline-block; padding-bottom: 6px; margin-bottom: -6px; z-index: 999999 !important; }
    .dropdown-content {
      display: none; position: absolute; top: calc(100% - 2px); left: 0; min-width: 250px;
      background: var(--bg-panel); border: 1.5px solid #0284c7; border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8); z-index: 9999999 !important;
    }
    .dropdown:hover .dropdown-content { display: block; }

    .dropdown-content button, .dropdown-submenu-btn {
      width: 100%; text-align: left; padding: 9px 12px; background: transparent;
      color: var(--text-main); border: none; font-size: 11px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.15s;
    }
    .dropdown-content button:hover, .dropdown-submenu-btn:hover {
      background: rgba(2, 132, 199, 0.25); color: #38bdf8;
    }

    .dropdown-submenu { position: relative; width: 100%; }
    .dropdown-submenu-content {
      display: none; position: absolute; top: 0; left: 100%; min-width: 230px;
      background: var(--bg-panel); border: 1.5px solid #0284c7; border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7); z-index: 10000000; margin-left: 2px;
    }
    .dropdown-submenu:hover .dropdown-submenu-content { display: block; }
    .dropdown-submenu-content button {
      width: 100%; text-align: left; padding: 9px 12px; background: transparent;
      color: var(--text-main); border: none; font-size: 11px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.15s;
    }
    .dropdown-submenu-content button:hover {
      background: rgba(2, 132, 199, 0.25); color: #38bdf8;
    }

    .portal-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .portal-status-dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: #10b981; box-shadow: 0 0 6px #10b981; margin-right: 2px;
    }
    .btn-portal {
      padding: 3px 9px; border-radius: 4px; font-size: 10.5px; font-weight: bold;
      border: none; cursor: pointer; color: #fff; background: #0284c7; transition: 0.2s; height: 26px;
    }
    .header-utils { display: flex; align-items: center; gap: 3px; }
    .btn-util {
      background: var(--bg-card); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 2px 7px; border-radius: 4px; font-size: 10.5px; cursor: pointer; font-weight: bold; height: 26px;
    }

    /* EXCEL-STYLE RIBBON TOOLBAR */
    .excel-ribbon-bar {
      background: #eef2f6;
      border-bottom: 1.5px solid #cbd5e1;
      padding: 3px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 38px;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      user-select: none;
    }
    body:not(.light-theme) .excel-ribbon-bar {
      background: #091322;
      border-bottom-color: #1a2c47;
    }

    .ribbon-group {
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }
    .ribbon-divider {
      width: 1px;
      height: 24px;
      background: #cbd5e1;
      margin: 0 4px;
    }
    body:not(.light-theme) .ribbon-divider {
      background: #1e2e4a;
    }

    .ribbon-select {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600;
      height: 24px;
      outline: none;
    }
    body:not(.light-theme) .ribbon-select {
      background: #070e1c;
      color: #f8fafc;
      border-color: #1e3a5f;
    }

    .ribbon-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 3px;
      width: 26px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      color: var(--text-main);
      transition: 0.15s;
    }
    .ribbon-btn:hover {
      background: rgba(2, 132, 199, 0.15);
      border-color: #0284c7;
    }
    .ribbon-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    .color-picker-wrap {
      display: inline-flex;
      align-items: center;
      position: relative;
      cursor: pointer;
    }
    .color-picker-wrap input[type="color"] {
      position: absolute;
      opacity: 0;
      width: 24px;
      height: 24px;
      cursor: pointer;
    }

    /* Main Workspace */
    .main-workspace {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
      padding: 6px 12px; width: 100%; height: calc(100vh - 78px);
    }
    
    .module-view { flex: 1; display: none; flex-direction: column; overflow: hidden; width: 100%; height: 100%; }
    .module-view.active { display: flex; }

    #moduleDashboardView.module-view.active,
    #moduleDsrPerfView.module-view.active,
    #moduleStockView.module-view.active,
    #moduleAiBrainView.module-view.active,
    #moduleSourceView.module-view.active {
      display: block !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      height: 100% !important;
    }

    /* Common Card & Form Styles */
    .control-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
    .time-gone-card {
      display: flex; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 5px; overflow: hidden;
    }
    .tg-col {
      padding: 3px 8px; text-align: center; border-right: 1px solid var(--border-color); min-width: 65px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .tg-col:last-child {
      border-right: none; background: #1e3a5f !important; color: #ffffff !important;
    }
    .tg-label { font-size: 9px; font-weight: bold; color: var(--text-subtle); margin-bottom: 1px; }
    .tg-val { font-size: 11.5px; font-weight: bold; color: var(--text-main); }
    .tg-col:last-child .tg-val { color: #ffffff !important; font-weight: 800; font-size: 12px; }

    .tg-input {
      width: 38px; background: var(--input-bg); border: 1px solid var(--border-color);
      color: var(--text-main); font-weight: bold; font-size: 11px; text-align: center;
      border-radius: 3px; outline: none; padding: 1px 0; margin: 0 auto;
    }

    .view-mode-container {
      background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 5px;
      padding: 3px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .view-mode-title { font-size: 8.5px; font-weight: 800; color: #f39c12; letter-spacing: 0.5px; margin-bottom: 3px; text-align: center; width: 100%; }
    .mode-buttons { display: flex; gap: 5px; align-items: center; justify-content: center; }
    .btn-mode { padding: 4px 12px; font-size: 11px; font-weight: bold; border-radius: 3px; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); transition: 0.2s; }
    .btn-mode.active { background: #f39c12; color: #070d18; border-color: #f39c12; font-weight: 800; }

    .action-buttons { display: flex; gap: 5px; align-items: center; margin-left: auto; flex-wrap: wrap; }
    .btn-act { padding: 5px 11px; font-size: 11px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; color: #ffffff !important; transition: 0.2s; display: inline-flex; align-items: center; gap: 4px; }
    .btn-all { background: #0284c7; }
    .btn-custom { background: #d97706; }
    .btn-save-date { background: #059669; }
    .btn-copy-text { background: #2563eb; }

    .history-bar, .filter-bar-compact { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 5px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-group { display: flex; align-items: center; gap: 6px; }
    .filter-label { font-size: 10.5px; font-weight: 800; color: #0284c7; text-transform: uppercase; }
    .custom-select, .date-input-field { background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 4px; font-size: 11px; outline: none; font-weight: 600; }

    /* REPORT TABLES */
    .table-chart-container { display: flex; width: 100%; flex: 1; overflow: hidden; margin-top: 2px; }
    .table-wrapper {
      width: 100%; overflow: auto; background: var(--bg-panel); border-radius: 6px; border: 1px solid var(--border-color);
      height: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.2); user-select: text;
    }
    
    .table-wrapper table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .table-wrapper th {
      background: var(--table-header-bg) !important; color: #ffffff !important;
      padding: 8px 10px; text-align: left; vertical-align: middle; position: sticky; top: 0; z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 800; letter-spacing: 0.3px; white-space: nowrap;
    }
    .table-wrapper th.num { text-align: right !important; }
    .table-wrapper td { padding: 6px 10px; border: 1px solid var(--border-color); color: var(--text-main); white-space: nowrap; vertical-align: middle; }
    .table-wrapper tr:nth-child(even) { background: var(--bg-row-alt); }
    .table-wrapper tr:hover { background: var(--bg-row-hover); }

    .table-wrapper th:first-child {
      position: sticky; left: 0; z-index: 25;
      background: var(--table-header-bg) !important; color: #ffffff !important; border-right: 2px solid #38bdf8 !important;
    }
    .table-wrapper td:first-child {
      position: sticky; left: 0; z-index: 8;
      background: var(--bg-panel) !important; border-right: 2px solid #38bdf8 !important; color: var(--text-main) !important; font-weight: 700;
    }
    .table-wrapper tr:nth-child(even) td:first-child { background: var(--bg-row-alt) !important; }
    .table-wrapper tr:hover td:first-child { background: var(--bg-row-hover) !important; }

    .table-wrapper tfoot tr td:first-child {
      position: sticky; left: 0; z-index: 26;
      background: var(--total-row-bg) !important; border-right: 2px solid #38bdf8 !important; color: #ffffff !important; font-weight: 800;
    }

    /* Active Highlight States */
    tr.excel-selected, .table-wrapper tr.excel-selected {
      background-color: #0284c7 !important;
      color: #ffffff !important;
    }
    tr.excel-selected td, .table-wrapper tr.excel-selected td {
      background-color: #0284c7 !important;
      color: #ffffff !important;
      border-color: #38bdf8 !important;
    }
    tr.excel-active-focus {
      outline: 2px solid #f59e0b !important;
    }

    .table-wrapper .num { text-align: right !important; font-family: 'Consolas', monospace; color: var(--text-main); }
    .table-wrapper .total-row {
      background: var(--total-row-bg) !important; color: var(--total-row-text) !important; font-weight: bold;
      position: sticky; bottom: 0; border-top: 2px solid #38bdf8; z-index: 15;
    }
    .table-wrapper .total-row td { color: var(--total-row-text) !important; font-weight: bold; }

    .cell-dsr-name { font-weight: 700; color: var(--text-main) !important; font-size: 11.5px; text-align: left; }
    .cf-green { color: #10b981 !important; font-weight: bold; }
    .cf-red { color: #ef4444 !important; font-weight: bold; }

    .live-alert-banner {
      display: none; background: linear-gradient(90deg, #10b981 0%, #059669 100%);
      color: #ffffff; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; text-align: center; margin-bottom: 6px;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75); display: none; align-items: center; justify-content: center; z-index: 99999;
    }
    .modal-box {
      background: var(--bg-panel); border: 2px solid #0284c7; border-radius: 8px;
      width: 620px; max-width: 92vw; padding: 18px; display: flex; flex-direction: column; max-height: 88vh; color: var(--text-main);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-input {
      width: 100%; background: var(--bg-card); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 7px 10px; border-radius: 4px; font-size: 12px; outline: none;
    }
    .sku-picker-list {
      flex: 1; overflow-y: auto; background: var(--bg-main); border: 1px solid var(--border-color);
      border-radius: 6px; padding: 8px; margin: 10px 0; max-height: 340px; display: flex; flex-direction: column; gap: 4px;
    }
    .sku-picker-item {
      display: flex !important; align-items: center; gap: 10px; padding: 5px 10px;
      border-radius: 4px; font-size: 12px; cursor: pointer; background: var(--bg-card);
      border: 1px solid transparent; width: 100%; box-sizing: border-box;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="top-header">
    <div class="top-nav-group">
      <button id="navBtnDash" class="nav-tab-btn active" onclick="switchMainModule('DASHBOARD')">
        📈 Dashboard
      </button>

      <div class="dropdown">
        <button id="navBtnReports" class="dropdown-btn">
          📊 Sales Reports ▾
        </button>
        <div class="dropdown-content">
          <button onclick="switchMainModule('TARGET')">🎯 Target vs Achievement</button>
          <button onclick="switchMainModule('PRODUCTIVITY')">⚡ Unique Productivity (CM vs LM)</button>
          <button onclick="switchMainModule('STOCK_REPORT')">📦 Stock Report & Dispatch</button>
          
          <div class="dropdown-submenu">
            <div class="dropdown-submenu-btn">
              <span>🚫 Zero Purchase Reports</span>
              <span style="font-size:10px;">▶</span>
            </div>
            <div class="dropdown-submenu-content">
              <button onclick="switchMainModule('ZERO_SHOP')">🏪 Shop Wise Zero Purchase</button>
              <button onclick="switchMainModule('ZERO_BRAND')">🏷️ Brand Wise Zero Purchase</button>
              <button onclick="switchMainModule('ZERO_SKU')">📦 SKU Wise Zero Purchase</button>
            </div>
          </div>
        </div>
      </div>

      <button id="navBtnSource" class="nav-tab-btn" onclick="switchMainModule('SOURCE')">
        📁 Source Files
      </button>

      <button id="navBtnDsrPerf" class="nav-tab-btn" onclick="switchMainModule('DSR_PERFORMANCE')">
        DSR Performance
      </button>

      <button id="navBtnAiBrain" class="nav-tab-btn" style="background:#091426; border-color:#0284c7; color:#38bdf8;" onclick="switchMainModule('AI_BRAIN')">
        🧠 AI Brain Analyzer
      </button>
    </div>

    <div class="portal-actions">
      <!-- ☁️ 1-CLICK CLOUD SYNC BUTTON -->
      <button class="btn-portal" style="background:#10b981; border:1px solid #34d399; font-weight:800;" onclick="triggerCloudSync()" title="Sync all master data to Supabase Cloud">
        ☁️ Sync to Cloud
      </button>

      <button id="themeToggleBtn" class="btn-util" onclick="toggleTheme()">☀️ Light Mode</button>
      
      <button class="btn-util" style="background:#0284c7; border-color:#38bdf8; color:#fff;" onclick="openSettingsModal()" title="SnD & DSS Login Credentials">
        ⚙ Settings
      </button>

      <span class="portal-status-dot"></span>
      <button class="btn-portal" onclick="openSnDWindow()">🌐 SnD Portal</button>
      <button class="btn-portal" style="background:#b91c1c; border:1px solid #ef4444;" onclick="openDSSWindow()">🏢 DSS Portal</button>
    </div>
  </div>

  <!-- EXCEL HOME RIBBON TOOLBAR -->
  <div class="excel-ribbon-bar">
    <div class="ribbon-group">
      <select id="ribbonFontFamily" class="ribbon-select" style="min-width:115px;" onchange="applyExcelRibbonAction('fontFamily', this.value)">
        <option value="'Calibri', 'Segoe UI', sans-serif" selected>Calibri</option>
        <option value="'Aptos', sans-serif">Aptos</option>
        <option value="'Segoe UI', sans-serif">Segoe UI</option>
        <option value="'Arial', sans-serif">Arial</option>
        <option value="'Consolas', monospace">Consolas</option>
        <option value="'Tahoma', sans-serif">Tahoma</option>
      </select>

      <select id="ribbonFontSize" class="ribbon-select" style="min-width:48px;" onchange="applyExcelRibbonAction('fontSize', this.value)">
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12" selected>12</option>
        <option value="13">13</option>
        <option value="14">14</option>
        <option value="16">16</option>
        <option value="18">18</option>
      </select>

      <button class="ribbon-btn" title="Increase Font Size (A^)" onclick="applyExcelRibbonAction('fontGrow', 1)">A<sup>▲</sup></button>
      <button class="ribbon-btn" title="Decrease Font Size (Av)" onclick="applyExcelRibbonAction('fontGrow', -1)">A<sup>▼</sup></button>
    </div>

    <div class="ribbon-divider"></div>

    <div class="ribbon-group">
      <button id="ribbonBoldBtn" class="ribbon-btn" style="font-weight:900;" title="Bold" onclick="applyExcelRibbonAction('bold')"><b>B</b></button>
      <button id="ribbonItalicBtn" class="ribbon-btn" style="font-style:italic;" title="Italic" onclick="applyExcelRibbonAction('italic')"><i>I</i></button>
      <button id="ribbonUnderlineBtn" class="ribbon-btn" style="text-decoration:underline;" title="Underline" onclick="applyExcelRibbonAction('underline')"><u>U</u></button>
    </div>

    <div class="ribbon-divider"></div>

    <div class="ribbon-group">
      <button class="ribbon-btn" title="Align Left" onclick="applyExcelRibbonAction('align', 'left')">⫷</button>
      <button class="ribbon-btn" title="Align Center" onclick="applyExcelRibbonAction('align', 'center')">≡</button>
      <button class="ribbon-btn" title="Align Right" onclick="applyExcelRibbonAction('align', 'right')">⫸</button>
    </div>

    <div class="ribbon-divider"></div>

    <div class="ribbon-group">
      <div class="color-picker-wrap" title="Fill Color (Background)">
        <span class="ribbon-btn" style="color:#eab308;">🪣</span>
        <input type="color" onchange="applyExcelRibbonAction('bgColor', this.value)" />
      </div>

      <div class="color-picker-wrap" title="Font Color">
        <span class="ribbon-btn" style="color:#ef4444; text-decoration:underline; font-weight:900;">A</span>
        <input type="color" onchange="applyExcelRibbonAction('textColor', this.value)" />
      </div>

      <button class="ribbon-btn" title="Reset Formatting on this page" style="color:#64748b; font-size:11px;" onclick="applyExcelRibbonAction('reset')">✕</button>
    </div>
  </div>

  <!-- Main Workspace -->
  <div class="main-workspace">
    <div id="moduleDashboardView" class="module-view active"></div>
    <div id="moduleTargetView" class="module-view"></div>
    <div id="moduleProdView" class="module-view"></div>
    <div id="moduleStockView" class="module-view"></div>
    <div id="moduleZeroShopView" class="module-view"></div>
    <div id="moduleZeroBrandView" class="module-view"></div>
    <div id="moduleZeroSkuView" class="module-view"></div>
    <div id="moduleSourceView" class="module-view"></div>
    <div id="moduleDsrPerfView" class="module-view"></div>
    <div id="moduleAiBrainView" class="module-view"></div>

    function cleanDSRName(rawName) {
      let cleaned = (rawName || '').toString().trim();
      if (!cleaned) return '';
      const dashPos = cleaned.indexOf('-');
      if (dashPos > -1 && dashPos < cleaned.length - 1) cleaned = cleaned.substring(dashPos + 1).trim();
      const mergePos = cleaned.toUpperCase().indexOf('-MERGE');
      if (mergePos > -1) cleaned = cleaned.substring(0, mergePos).trim();
      const parenPos = cleaned.indexOf('(');
      if (parenPos > -1) cleaned = cleaned.substring(0, parenPos).trim();
      if (cleaned.endsWith('-')) cleaned = cleaned.substring(0, cleaned.length - 1).trim();
      return cleaned;
    }

        let matchBrand = true;
        if (activeBrand !== 'ALL') {

            const skus = customBrandsMap[cName] || [];

          }
        }
        const matchDSR = (activeDSR === 'ALL' || r.dsrName === activeDSR);
        return matchArea && matchDist && matchBrand && matchDSR;
      });
    }

    function clearExcelSelection(targetTable = null) {
      const scope = targetTable || document;
      scope.querySelectorAll('tr.excel-selected, tr.excel-active-focus').forEach(r => {
        r.classList.remove('excel-selected', 'excel-active-focus');
      });
      if (!targetTable || targetTable === currentlyFocusedTable) {
        activeAnchorRow = null;
      }
    }

    document.addEventListener('click', function(e) {
      if (['INPUT', 'BUTTON', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;

      const td = e.target.closest('tbody td');
      if (!td) return;

      const currentRow = td.closest('tr');
      const table = currentRow ? currentRow.closest('table') : null;
      if (!table || !currentRow) return;

      if (currentlyFocusedTable && currentlyFocusedTable !== table) {
        clearExcelSelection(currentlyFocusedTable);
      }
      currentlyFocusedTable = table;

      const allRows = Array.from(table.querySelectorAll('tbody tr')).filter(r => r.style.display !== 'none');
      const currentIndex = allRows.indexOf(currentRow);

      if (e.shiftKey && activeAnchorRow && activeAnchorRow.closest('table') === table) {
        const anchorIndex = allRows.indexOf(activeAnchorRow);
        const min = Math.min(anchorIndex, currentIndex);
        const max = Math.max(anchorIndex, currentIndex);

        allRows.forEach((r, idx) => {
          if (idx >= min && idx <= max) {
            r.classList.add('excel-selected');
          } else {
            r.classList.remove('excel-selected');
          }
          r.classList.remove('excel-active-focus');
        });

        currentRow.classList.add('excel-active-focus');
      } else if (e.ctrlKey || e.metaKey) {
        currentRow.classList.toggle('excel-selected');
        activeAnchorRow = currentRow;
      } else {
        clearExcelSelection(table);
        currentRow.classList.add('excel-selected', 'excel-active-focus');
        activeAnchorRow = currentRow;
      }
    });

        const dTo = (currentMonthView === 'CM') ? (document.getElementById('cmToDate')?.value || cmSelectedTo) : (document.getElementById('lmToDate')?.value || lmSelectedTo);
        if (dFrom && dTo) dateTag = `Range: ${dFrom} to ${dTo}`;
      } else if (isDsrPerf) {
        const pStart = document.getElementById('perfStartDate')?.value || '';
        const pEnd = document.getElementById('perfEndDate')?.value || '';
        if (pStart && pEnd) dateTag = `Range: ${pStart} to ${pEnd}`;
      }

      const selDist = isStock ? 'KHI – REHMAN ENT-BR2' : (document.getElementById('selectDist')?.value || 'KHI – REHMAN ENT-BR2');
      const naturalWidth = Math.max(760, Math.min(1350, sourceTable.scrollWidth || sourceTable.offsetWidth || 950));

      const captureBox = document.createElement('div');
      captureBox.style.cssText = `
        position: fixed;
        left: -99999px;
        top: 0px;
        background: ${cardBg};
        padding: 16px;
        border: 2px solid #0284c7;
        border-radius: 8px;
        width: ${naturalWidth + 32}px;
        box-sizing: border-box;
      `;

      const headerDiv = document.createElement('div');
      headerDiv.style.cssText = `
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: ${headerBoxBg};
        border: 1.5px solid ${headerBoxBorder};
        border-radius: 6px;
        padding: 10px 14px;
        margin-bottom: 12px;
      `;
      headerDiv.innerHTML = `
        <div>
          <div style="font-size: 14.5px; font-weight: 900; color: ${titleColor}; letter-spacing: 0.4px; text-transform: uppercase;">
            ${reportTitle}
          </div>
          <div style="font-size: 11px; color: ${subTextColor}; margin-top: 3px;">
            <b>Mode:</b> ${reportSubMode} &nbsp;|&nbsp; <b>Distributor:</b> ${selDist}
          </div>
        </div>
        <div style="text-align: right;">
          <div style="font-size: 11px; font-weight: 800; color: ${dateBadgeColor}; background: ${dateBadgeBg}; padding: 3px 9px; border-radius: 4px; border: 1px solid #0284c7; display: inline-block;">
            📅 ${dateTag}
          </div>
          <div style="font-size: 9.5px; color: ${subTextColor}; margin-top: 3px; font-weight: bold;">MULTI TRACKING SYSTEM • DANISH RAIS</div>
        </div>
      `;
      captureBox.appendChild(headerDiv);

      const clonedTable = document.createElement('table');
      clonedTable.style.cssText = `
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        background: ${cardBg};
        color: ${baseTextColor};
      `;

      const origThead = sourceTable.querySelector('thead');
      if (origThead) {
        const theadClone = document.createElement('thead');
        Array.from(origThead.querySelectorAll('tr')).forEach(origTr => {
          const trClone = document.createElement('tr');
          Array.from(origTr.querySelectorAll('th')).forEach(th => {
            if (th.style.display === 'none') return;
            const thClone = th.cloneNode(true);
            const isNum = th.classList.contains('num');
            thClone.style.cssText = `
              background: #1e3a5f !important;
              color: #ffffff !important;
              padding: 6px 8px;
              font-weight: 800;
              border: 1px solid rgba(255,255,255,0.25);
              text-align: ${isNum ? 'right' : 'left'};
              white-space: nowrap;
              font-size: 10.5px;
            `;
            trClone.appendChild(thClone);
          });
          theadClone.appendChild(trClone);
        });
        clonedTable.appendChild(theadClone);
      }

      const tbodyClone = document.createElement('tbody');
      rowsToCapture.forEach((r, rIdx) => {
        const trClone = document.createElement('tr');
        const isSubtotal = r.classList.contains('subtotal-row') || r.classList.contains('brand-total-row') || r.classList.contains('cat-total-row');
        const isGrandTotal = r.classList.contains('grandtotal-row') || r.classList.contains('stock-grand-total') || r.classList.contains('total-row');

        let rowBg = (rIdx % 2 === 0) ? (isLight ? '#ffffff' : '#0b1526') : (isLight ? '#f8fafc' : '#091222');
        if (isSubtotal) rowBg = isLight ? '#dbeafe' : '#1e3a5f';
        if (isGrandTotal) rowBg = '#091322';

        Array.from(r.querySelectorAll('td')).forEach((td, cIdx) => {
          if (td.style.display === 'none') return;
          const tdClone = td.cloneNode(true);
          const isNum = td.classList.contains('num');

          let textClr = baseTextColor;
          if (isSubtotal) textClr = isLight ? '#1e3a5f' : '#ffffff';
          if (isGrandTotal) textClr = '#fbbf24';

          tdClone.style.cssText = `
            background: ${rowBg} !important;
            color: ${textClr} !important;
            padding: 5px 7px;
            border: 1px solid ${cellBorder};
            font-weight: ${(isSubtotal || isGrandTotal) ? '900' : (cIdx === 0 ? '700' : '600')};
            text-align: ${isNum ? 'right' : 'left'};
            font-family: ${isNum ? "'Consolas', monospace" : "inherit"};
            white-space: nowrap;
            font-size: ${isGrandTotal ? '12px' : '10.5px'};
          `;
          trClone.appendChild(tdClone);
        });
        tbodyClone.appendChild(trClone);
      });
      clonedTable.appendChild(tbodyClone);

      captureBox.appendChild(clonedTable);
      document.body.appendChild(captureBox);

      try {
        const canvas = await html2canvas(captureBox, {
          backgroundColor: cardBg,
          scale: 2,
          logging: false,
          useCORS: true
        });

        const dataUrl = canvas.toDataURL('image/png', 1.0);
        if (ipcRenderer) {
          const res = await ipcRenderer.invoke('copy-image-to-clipboard', dataUrl);
          if (res && res.success) {
            showBannerAlert(`🎉 HD Report Card Copied to Clipboard!`, "#10b981");
            return;
          }
        }
        
        const blob = await (await fetch(dataUrl)).blob();
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        showBannerAlert(`🎉 HD Report Card Copied!`, "#10b981");
      } catch (err) {
        console.error("Capture Error:", err);
      } finally {
        document.body.removeChild(captureBox);
      }
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', async (e) => {
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

      if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
        const table = getActiveTableElement();
        if (!table) return;

        let selectedRows = Array.from(table.querySelectorAll('tbody tr.excel-selected'));

        if (selectedRows.length === 0) {
          const sel = window.getSelection();
          if (sel && sel.rangeCount > 0 && sel.toString().trim().length > 0) {
            const range = sel.getRangeAt(0);
            const container = document.createElement('div');
            container.appendChild(range.cloneContents());
            const matchedRows = Array.from(container.querySelectorAll('tr'));
            if (matchedRows.length > 0) selectedRows = matchedRows;
          }
        }

        if (selectedRows.length > 0) {
          e.preventDefault();
          e.stopPropagation();
          await captureAndCopyHDImage(selectedRows, table);
          return;
        }

        e.preventDefault();
        copyTableAsImage(table.id);
      }

      if (e.key === 'ArrowDown') {
        const table = getActiveTableElement();
        if (!table) return;
        const rows = Array.from(table.querySelectorAll('tbody tr')).filter(r => r.style.display !== 'none');
        if (!rows.length) return;

        let focusedIdx = rows.findIndex(r => r.classList.contains('excel-active-focus'));
        if (focusedIdx === -1) focusedIdx = 0;

        if (focusedIdx < rows.length - 1) {
          e.preventDefault();
          const nextIdx = focusedIdx + 1;
          if (e.shiftKey && activeAnchorRow && activeAnchorRow.closest('table') === table) {
            const anchorIdx = rows.indexOf(activeAnchorRow);
            const min = Math.min(anchorIdx, nextIdx);
            const max = Math.max(anchorIdx, nextIdx);
            rows.forEach((r, i) => {
              r.classList.toggle('excel-selected', i >= min && i <= max);
              r.classList.remove('excel-active-focus');
            });
            rows[nextIdx].classList.add('excel-active-focus');
            rows[nextIdx].scrollIntoView({ block: 'nearest' });
          } else {
            clearExcelSelection(table);
            rows[nextIdx].classList.add('excel-selected', 'excel-active-focus');
            activeAnchorRow = rows[nextIdx];
            rows[nextIdx].scrollIntoView({ block: 'nearest' });
          }
        }
      }

      if (e.key === 'ArrowUp') {
        const table = getActiveTableElement();
        if (!table) return;
        const rows = Array.from(table.querySelectorAll('tbody tr')).filter(r => r.style.display !== 'none');
        if (!rows.length) return;

        let focusedIdx = rows.findIndex(r => r.classList.contains('excel-active-focus'));
        if (focusedIdx <= 0) return;

        e.preventDefault();
        const prevIdx = focusedIdx - 1;
        if (e.shiftKey && activeAnchorRow && activeAnchorRow.closest('table') === table) {
          const anchorIdx = rows.indexOf(activeAnchorRow);
          const min = Math.min(anchorIdx, prevIdx);
          const max = Math.max(anchorIdx, prevIdx);
          rows.forEach((r, i) => {
            r.classList.toggle('excel-selected', i >= min && i <= max);
            r.classList.remove('excel-active-focus');
          });
          rows[prevIdx].classList.add('excel-active-focus');
          rows[prevIdx].scrollIntoView({ block: 'nearest' });
        } else {
          clearExcelSelection(table);
          rows[prevIdx].classList.add('excel-selected', 'excel-active-focus');
          activeAnchorRow = rows[prevIdx];
          rows[prevIdx].scrollIntoView({ block: 'nearest' });
        }
      }
    });

    async function copyTableAsImage(tableId) {
      let targetTable = document.getElementById(tableId);
      if (!targetTable) targetTable = getActiveTableElement();
      if (!targetTable) return alert("Table mojood nahi hai!");

      const rows = Array.from(targetTable.querySelectorAll('tbody tr')).filter(r => r.style.display !== 'none');
      if (rows.length === 0) return alert("Table mein koi data nahi mila!");
      await captureAndCopyHDImage(rows, targetTable);
    }

    async function loadBothDumps() {
      try {
        if (ipcRenderer) {
          const res = await ipcRenderer.invoke('get-both-sales-dumps');
          if (res.success) {
            lmDump = res.lmData;
            cmDump = res.cmData;
            initDumpDates();
            populateProdFilters();
            return;
          }
        }

        if (window.CloudStorage) {
          const cloudCm = await CloudStorage.load('SALES_DUMP_CM');
          if (cloudCm) cmDump = cloudCm;
          initDumpDates();
          populateProdFilters();
        }
      } catch (e) {}
    }

    function initDumpDates() {
      const lmDates = (lmDump && lmDump.deliveredRecords) ? lmDump.deliveredRecords.map(r => r.date).filter(Boolean).sort() : [];
      if (lmDates.length > 0) {
        lmSelectedFrom = lmDates[0]; lmSelectedTo = lmDates[lmDates.length - 1];
        const f = document.getElementById('lmFromDate'); const t = document.getElementById('lmToDate');
        if (f) f.value = lmSelectedFrom; if (t) t.value = lmSelectedTo;
      }
      const cmDates = (cmDump && cmDump.deliveredRecords) ? cmDump.deliveredRecords.map(r => r.date).filter(Boolean).sort() : [];
      if (cmDates.length > 0) {
        cmSelectedFrom = cmDates[0]; cmSelectedTo = cmDates[cmDates.length - 1];
        const f = document.getElementById('cmFromDate'); const t = document.getElementById('cmToDate');
        if (f) f.value = cmSelectedFrom; if (t) t.value = cmSelectedTo;
      }
    }

    async function saveAllSettingsCredentials() {
      const sndDist = document.getElementById('settingSndDist').value.trim();
      const sndUser = document.getElementById('settingSndUser').value.trim();
      const sndPass = document.getElementById('settingSndPass').value.trim();
      const dssUser = document.getElementById('settingDssUser').value.trim();
      const dssPass = document.getElementById('settingDssPass').value.trim();

      const credObj = {
        snd: { distributor: sndDist, username: sndUser, password: sndPass },
        dss: { username: dssUser, password: dssPass }
      };

      if (ipcRenderer) {
        const res = await ipcRenderer.invoke('save-all-credentials', credObj);
        if (res.success) { closeSettingsModal(); showBannerAlert("⚙️ Credentials saved!", "#059669"); return; }
      }
      
      localStorage.setItem('appCredentials', JSON.stringify(credObj));
      closeSettingsModal(); 
      showBannerAlert("⚙️ Credentials saved locally!", "#059669");
    }

    function showBannerAlert(msg, bg = 'linear-gradient(90deg, #10b981 0%, #059669 100%)') {

      if (!banner) return;
      banner.innerText = msg; banner.style.background = bg; banner.style.display = 'block';
      setTimeout(() => { banner.style.display = 'none'; }, 4000);
    }
